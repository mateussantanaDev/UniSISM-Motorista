name: unisism_motorista
description: "UNISISM Motorista — App TFD para motoristas de transporte de pacientes (Prefeitura de Águas Belas)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Core
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  meta: ^1.16.0

  # Persistência local (SQLite tipado)
  drift: ^2.21.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5

  # Connectivity + sync
  connectivity_plus: ^6.1.1

  # Mapa offline (OpenStreetMap)
  flutter_map: ^7.0.2
  flutter_map_tile_caching: ^9.1.4
  latlong2: ^0.9.1

  # Tipografia (Inter via Google Fonts até F1 empacotar TTFs locais)
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8

  # Push notifications (ntfy.sh self-hosted)
  shared_preferences: ^2.3.3
  flutter_local_notifications: ^18.0.1
  web_socket_channel: ^3.0.1
  uuid: ^4.5.1
  logger: ^2.5.0

  # F15 — Push notifications (FCM legacy, kept commented out)
  # firebase_core: ^3.9.0
  # firebase_messaging: ^15.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift code-gen
  build_runner: ^2.4.13
  drift_dev: ^2.21.0

# `path_provider_foundation` 2.6.0 introduziu FFI com `objective_c` que falha
# no iOS Simulator (Xcode 26): "Couldn't resolve native function DOBJC_initializeApi".
# Travamos abaixo de 2.6.0 (versões 2.4.x/2.5.x usam method channel clássico).
dependency_overrides:
  path_provider_foundation: '>=2.4.0 <2.6.0'

flutter:
  uses-material-design: true

  # Fontes empacotadas localmente (LGPD/air-gap — sem CDN do Google Fonts)
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

